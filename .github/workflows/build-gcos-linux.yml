name: Build gcOS Linux

on:
  workflow_dispatch:
  push:
    paths:
      - "linux/**"
      - ".github/workflows/build-gcos-linux.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out gcOS
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             live-build             debootstrap             xorriso             squashfs-tools             qemu-system-x86

      - name: Build gcOS ISO
        working-directory: linux
        run: |
          chmod +x build-gcos.sh auto/config
          ./build-gcos.sh

      - name: Upload gcOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: gcos-linux-iso
          path: linux/build-output/gcos-linux.iso
          if-no-files-found: error
