name: Build xoriesOS

on:
  workflow_dispatch:
  push:
    paths:
      - "linux/**"
      - ".github/workflows/build-xoriesos.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out xoriesOS
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             live-build             debootstrap             debian-archive-keyring             xorriso             squashfs-tools             qemu-system-x86

      - name: Fix live-build Debian Contents paths
        run: |
          sudo sed -i             's#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz#${LB_PARENT_MIRROR_CHROOT}/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g'             /usr/lib/live/build/lb_chroot_linux-image
          sudo sed -i             's#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz#${LB_MIRROR_CHROOT}/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g'             /usr/lib/live/build/lb_chroot_linux-image
          grep -n "Contents-" /usr/lib/live/build/lb_chroot_linux-image

      - name: Build xoriesOS
        working-directory: linux
        run: |
          chmod +x auto/config
          chmod +x build-xoriesos.sh
          chmod +x config/hooks/live/0100-install-google-chrome.chroot
          chmod +x config/hooks/live/0200-xoriesos-branding.chroot
          sudo ./build-xoriesos.sh

      - name: Verify ISO
        run: |
          test -f linux/build-output/xoriesOS.iso
          ls -lh linux/build-output/xoriesOS.iso
          file linux/build-output/xoriesOS.iso

      - name: Upload xoriesOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: xoriesOS-iso
          path: linux/build-output/xoriesOS.iso
          if-no-files-found: error
          retention-days: 7
